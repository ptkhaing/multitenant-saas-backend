spring.application.name=multitenant-saas-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/multitenant_saas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ptk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:dev-only-fallback-secret-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}
logging.level.org.springframework.security=DEBUG